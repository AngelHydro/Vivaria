name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # publier la release sur les tags

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]  # macos-latest = Apple Silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt pyinstaller pillow
      - run: pyinstaller --noconfirm Vivaria.spec
      - name: Zip .app (macOS)
        if: runner.os == 'macOS'
        run: cd dist && ditto -c -k --keepParent Vivaria.app Vivaria-macOS-$(uname -m).zip
      - uses: actions/upload-artifact@v4
        with:
          name: Vivaria-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.exe
      - name: Publier la release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.exe
