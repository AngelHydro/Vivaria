name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-13, windows-latest]  # macos-latest = Apple Silicon, macos-13 = Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt pyinstaller pillow
      - run: pyinstaller --noconfirm Vivaria.spec
      - name: Zip .app (macOS)
        if: runner.os == 'macOS'
        run: cd dist && ditto -c -k --keepParent Vivaria.app Vivaria-macOS-$(uname -m).zip
      - uses: actions/upload-artifact@v4
        with:
          name: Vivaria-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.exe
